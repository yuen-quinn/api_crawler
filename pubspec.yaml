name: api_crawler
description: >-
  A generic, extensible API crawler framework for Dart. Pipeline stages,
  pluggable adapters, HTTP transport with rate limiting, and checkpointed sync.
version: 0.1.0
repository: https://github.com/yuen-quinn/api_crawler
issue_tracker: https://github.com/yuen-quinn/api_crawler/issues
homepage: https://github.com/yuen-quinn/api_crawler

environment:
  sdk: ^3.5.0

dependencies:
  cron: ^0.6.2
  crypto: ^3.0.6
  http: ^1.2.2
  logging: ^1.3.0
  meta: ^1.16.0
  path: ^1.9.1

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.8

topics:
  - crawler
  - scraper
  - http
  - etl
  - api
